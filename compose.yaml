services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: shadow-po-app
    env_file:
      - .env
    ports:
      - "8000:8000"
    volumes:
      - .:/app
    depends_on:
      - db
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  db:
    image: postgres:16
    container_name: shadow-po-db
    environment:
      POSTGRES_DB: shadow_po
      POSTGRES_USER: shadow_user
      POSTGRES_PASSWORD: shadow_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data: