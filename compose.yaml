services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: shadow-po-app
    env_file:
      - .env
    environment:
      FRONTEND_APP_URL: http://localhost:5173
    ports:
      - "8000:8000"
    volumes:
      - .:/app
    depends_on:
      - db
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    container_name: shadow-po-frontend
    working_dir: /frontend
    environment:
      VITE_API_PROXY_TARGET: http://app:8000
      VITE_USE_POLLING: "true"
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/frontend
      - frontend_node_modules:/frontend/node_modules
    depends_on:
      - app

  db:
    image: postgres:16
    container_name: shadow-po-db
    environment:
      POSTGRES_DB: shadow_po
      POSTGRES_USER: shadow_user
      POSTGRES_PASSWORD: shadow_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
  frontend_node_modules:
